{% extends "base.html" %}
{% block main %}
<article>
  <header class="title"><h1>{{ page.title }}</h1></header>
  {{ content }}
  <ol class="entries">
  {% for p in pages %}
    <li>
      <a class="entry-title" href="{{ p.url }}">{{ p.title }}</a> <span class="date">{{ p.date | datefmt }}</span>
      {% if p.summary %}
      <div class="summary">{{ p.summary }} <a class="more" href="{{ p.url }}">Read more&nbsp;→</a></div>
      {% endif %}
    </li>
  {% endfor %}
  </ol>
</article>
{% endblock %}
