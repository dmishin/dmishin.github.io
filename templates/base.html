<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ page.title }}{% endblock %} — {{ site.title }}</title>
<link rel="stylesheet" href="{{ site.base_path }}/style.css">
<script>
MathJax = {
  loader: {load: ['[tex]/mhchem']},
  tex: {inlineMath: [['\\(', '\\)']], displayMath: [['\\[', '\\]']], packages: {'[+]': ['mhchem']}},
  options: {processHtmlClass: 'arithmatex', ignoreHtmlClass: '.*'}
};
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
</head>
<body>
<header class="site">
  <a class="brand" href="{{ site.base_path }}/index.html">{{ site.title }}</a>
  <nav>
  {% for label, path in site.menu or [] %}
    <a href="{{ site.base_path }}/{{ path }}"{% if page and page.url == site.base_path ~ '/' ~ path %} aria-current="page"{% endif %}>{{ label }}</a>
  {% endfor %}
  </nav>
</header>
<main>
{% block main %}{% endblock %}
</main>
<footer class="site">
  <a href="{{ site.base_path }}/index.html">{{ site.title }}</a>{% if site.description %} · {{ site.description }}{% endif %}
</footer>
</body>
</html>
