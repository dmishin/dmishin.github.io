{% extends "base.html" %}
{% block main %}
<article>
  <h1>{{ page.title }}</h1>
  {% if page.tag_links %}
  <p class="meta">{{ page.date | datefmt }} ·
    {% for tag, url in page.tag_links %}<a class="tag" href="{{ url }}">{{ tag }}</a> {% endfor %}</p>
  {% endif %}
  {{ content }}
</article>
{% endblock %}
