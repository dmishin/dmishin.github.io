{% extends "base.html" %}
{% block title %}Tags{% endblock %}
{% block main %}
<article>
  <header class="title"><h1>Index of tags</h1></header>
  <ul class="tag-index">
  {% for tag, url, pages in tags %}
    <li><a href="{{ url }}">{{ tag }}</a> <span class="count">{{ pages | length }}</span></li>
  {% endfor %}
  </ul>
</article>
{% endblock %}
